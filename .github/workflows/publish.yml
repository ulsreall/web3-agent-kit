name: Publish to PyPI

# Manual dispatch is the primary trigger.
#
# `release: [published]` used to be here, but it never fired: Release Please
# creates the release with GITHUB_TOKEN, and GitHub suppresses events raised by
# that token to avoid run loops. Every publish between v1.17.0 and v1.18.0
# needed a manual dispatch, which made the pipeline look wired up when it was
# not. The dead trigger was removed rather than left in place.
#
# Automating this properly means publishing from inside the Release Please
# workflow run and adding a matching trusted publisher on PyPI. Until that
# binding exists on PyPI, a move would break publishing rather than fix it.
# When it is set up, keep the workflow name and job name here stable: PyPI
# binds the trusted publisher to both.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install build cyclonedx-py
      - run: python -m build
      - name: Generate SBOM
        run: python -m cyclonedx_py requirements requirements.txt --output-format json > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

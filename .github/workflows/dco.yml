name: DCO
on:
  pull_request:
    branches: [ master, main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          # Automated release bumps are authored by github-actions[bot] via
          # GITHUB_TOKEN and cannot carry a personal Signed-off-by. The DCO
          # certifies that a human has the right to submit the code, so only
          # human-authored commits are checked here.
          MISSING=$(git log --no-merges --format="%h %an <%ae>" origin/master..HEAD | while read hash author; do
            case "$author" in
              *"github-actions[bot]"*|*"dependabot[bot]"*) continue ;;
            esac
            if ! git log --format="%B" -1 "$hash" | grep -q "^Signed-off-by:"; then
              echo "$hash $author"
            fi
          done)
          if [ -n "$MISSING" ]; then
            echo "❌ Commits missing Signed-off-by:"
            echo "$MISSING"
            echo ""
            echo "Fix with: git commit --amend --signoff"
            exit 1
          fi
          echo "✅ All human-authored commits have Signed-off-by"
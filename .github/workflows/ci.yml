name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install ruff
      run: python -m pip install --upgrade pip ruff

    - name: Lint
      run: ruff check .

    - name: Format check
      run: ruff format --check .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Audit dependencies
      run: |
        python -m pip install --upgrade pip pip-audit
        # Audit the project's own dependency set, not the runner's preinstalled
        # environment (which carries its own setuptools/pip that the project
        # does not control).
        pip install -r requirements-lock.txt --dry-run --report /tmp/report.json --quiet
        pip-audit --progress-spinner off --requirement requirements-lock.txt --skip-editable

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,solana]"
        pip install "tomli>=2.0; python_version < '3.11'"

    - name: Import smoke test
      run: |
        python - <<'PY'
        import web3_agent_kit
        from web3_agent_kit import Agent, Wallet, Chain
        assert web3_agent_kit.__version__
        print("import ok", web3_agent_kit.__version__)
        PY

    - name: Enforce the signing surface
      run: |
        python tools/check_signing_surface.py

    - name: Run tests
      timeout-minutes: 10
      run: |
        pytest tests/ --cov=web3_agent_kit --cov-report=xml --timeout=30

    - name: Upload coverage
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

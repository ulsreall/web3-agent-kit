site_name: Web3 Agent Kit
site_description: Open-source framework for building autonomous AI agents that interact with blockchain networks.
site_url: https://ulsreall.github.io/web3-agent-kit/
repo_url: https://github.com/ulsreall/web3-agent-kit
repo_name: ulsreall/web3-agent-kit
edit_uri: edit/master/docs/

# Internal working material that ships in the repo but not on the docs site:
# outreach drafts, and the review directory holding a raw .patch artifact.
exclude_docs: |
  promotion/
  review/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ulsreall/web3-agent-kit
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/itseywacc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/web3-agent-kit/
  generator: false

nav:
  - Home: index.md
  - Start:
      - Getting Started: getting-started.md
      - Examples: examples.md
      - CLI: cli.md
      - REST API Server: api-server.md
  - Concepts:
      - Features: features.md
      - Capability Matrix: capability-matrix.md
      - Execution Paths: architecture/execution-paths.md
      - Project Maturity: project-maturity.md
      - Versioning Policy: versioning-policy.md
  - Safety:
      - Safety and Transaction Pipeline: safety-and-transaction-pipeline.md
      - Security Model: security-model.md
      - Safety Gap Matrix: security/safety-gap-matrix.md
  - API Reference:
      - Agent: api/agent.md
      - Wallet: api/wallet.md
      - Chain: api/chain.md
      - LLM: api/llm.md
      - Portfolio: api/portfolio.md
      - Trading: api/trading.md
      - DeFi: api/defi.md
      - Bridge: api/bridge.md
      - Sniper: api/sniper.md
      - Airdrop: api/airdrop.md
      - NFT: api/nft.md
      - MEV: api/mev.md
      - Security Module: api/security.md
      - Oracle: api/oracle.md
      - Events: api/events.md
      - Simulator: api/simulator.md
      - Account Abstraction: api/account_abstraction.md
      - Messaging: api/messaging.md
      - Governance: api/governance.md
  - Architecture Decision Records:
      - ADR-001 Public RPC Defaults: adr/adr-001-public-rpc-defaults.md
      - ADR-002 Builder Pattern: adr/adr-002-builder-pattern.md
      - ADR-003 Multi-Source Oracle: adr/adr-003-multi-source-oracle.md
  - Background:
      - Airdrop Landscape 2026: research/airdrop_landscape_2026.md
      - Comparison vs Alternatives: blog/comparison-vs-alternatives.md
  - Contributing:
      - Contributing: contributing.md
      - Contributing Platforms: contributing-platforms.md
  - Changelog: changelog.md
